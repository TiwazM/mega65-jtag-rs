[package]
name = "mega65"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Library and CLI for developing and debugging on the MEGA65 over its JTAG/serial-monitor interface"
license = "GPL-3.0-or-later"

[workspace]
members = [".", "gui"]

[lib]
name = "mega65"
path = "src/lib.rs"

[[bin]]
name = "m65rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
libc = "0.2"
png = "0.17"
rand = "0.8"
rusb = "0.9"
serialport = { version = "4", default-features = false }
thiserror = "1"
